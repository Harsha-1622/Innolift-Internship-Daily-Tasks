{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h1 class="mb-4">

        Prediction History

    </h1>

    <div class="card shadow p-4">

        <table class="table table-hover">

            <thead>

                <tr>

                    <th>S.No</th>

                    <th>Predicted Power</th>

                    <th>Category</th>

                    <th>Advice</th>

                    <th>Date</th>

                </tr>

            </thead>

            <tbody>

                {% for record in records %}

                <tr>

                    <td>

                        {{ loop.index }}

                    </td>

                    <td>

                        {{ record[0] }} kW

                    </td>

                    <td>

                        {{ record[1] }}

                    </td>

                    <td>

                        {{ record[2] }}

                    </td>

                    <td>

                        {{ record[3] }}

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
