{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row">

        <!-- Input Form -->

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2>

                    ⚡ Energy Prediction

                </h2>

                <hr>

                <form method="POST">

                    <input
                        type="number"
                        step="0.01"
                        class="form-control mb-3"
                        name="global_reactive_power"
                        placeholder="Global Reactive Power"
                        value="{{ global_reactive_power }}"
                        required>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control mb-3"
                        name="voltage"
                        placeholder="Voltage"
                        value="{{ voltage }}"
                        required>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control mb-3"
                        name="global_intensity"
                        placeholder="Global Intensity"
                        value="{{ global_intensity }}"
                        required>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control mb-3"
                        name="sub_metering_1"
                        placeholder="Sub Metering 1"
                        value="{{ sub_metering_1 }}"
                        required>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control mb-3"
                        name="sub_metering_2"
                        placeholder="Sub Metering 2"
                        value="{{ sub_metering_2 }}"
                        required>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control mb-4"
                        name="sub_metering_3"
                        placeholder="Sub Metering 3"
                        value="{{ sub_metering_3 }}"
                        required>

                    <div class="d-flex gap-3">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Predict

                        </button>

                        <a
                            href="/predict"
                            class="btn btn-danger">

                            Refresh

                        </a>

                    </div>

                </form>

            </div>

        </div>

        <!-- Prediction Result -->

        <div class="col-md-6">

            <div class="card shadow p-5">

                <h2>

                    📊 Prediction Result

                </h2>

                <hr>

                {% if prediction %}

                    <h1>

                        {{ prediction }} kW

                    </h1>

                    <br>

                    <h3>

                        {{ category }}

                    </h3>

                    <br>

                    <p>

                        {{ advice }}

                    </p>

                {% else %}

                    <h3>

                        No prediction yet

                    </h3>

                    <p>

                        Enter values and click Predict.

                    </p>

                {% endif %}

            </div>

        </div>

    </div>

</div>

{% endblock %}
