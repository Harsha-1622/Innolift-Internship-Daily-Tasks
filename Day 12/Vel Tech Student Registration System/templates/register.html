<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav>
    <div class="logo">
        <img src="{{ url_for('static', filename='images/veltech_logo.png') }}" alt="Vel Tech Logo">
        <div>
            <h2>Vel Tech University</h2>
            <p>Student Registration System</p>
        </div>
    </div>

    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/register">Register</a></li>
        <li><a href="/students">Students</a></li>
        <li><a href="/about">About</a></li>
    </ul>
</nav>

<div class="form-container">

    <h1>Student Registration Form</h1>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Student Name"
               required>

        <input type="text"
               name="roll_number"
               placeholder="Roll Number"
               required>

        <input type="text"
               name="department"
               placeholder="Department"
               required>

        <select name="year" required>
    <option value="">Select Year</option>
    <option value="1">1st Year</option>
    <option value="2">2nd Year</option>
    <option value="3">3rd Year</option>
    <option value="4">4th Year</option>
</select>

        <input type="email"
               name="email"
               placeholder="Email Address"
               required>

        <input type="text"
               name="phone"
               placeholder="Phone Number"
               required>

        <select name="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <textarea
            name="address"
            rows="4"
            placeholder="Address"
            required></textarea>

        <button type="submit">
            Register Student
        </button>

    </form>

    {% if message %}
<div id="popup" class="success-popup">
    ✅ {{ message }}
</div>

<script>
    setTimeout(function() {
        document.getElementById("popup").style.display = "none";
    }, 2000);
</script>
{% endif %}

</div>

<footer>
    <p>© 2026 Vel Tech University | Student Registration System</p>
</footer>

</body>
</html>
