{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center">

                    Verify OTP

                </h2>

                <form method="POST">

                    <input

                        type="text"

                        name="otp"

                        class="form-control mb-3"

                        placeholder="Enter OTP"

                        required

                    >

                    <button

                        class="btn btn-success w-100"

                    >

                        Verify

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
